<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Z-Score Strategy Monitor</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e0e0e0;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:13px;min-height:100vh}

.nav-link{color:#8b949e;text-decoration:none;padding:4px 8px;border-radius:4px;transition:background .15s}
.nav-link:hover{background:#21262d;color:#e0e0e0}
.nav-link.active{color:#64ffda;font-weight:bold}
.conn-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.conn-ok{background:#4caf50;box-shadow:0 0 6px #4caf50}
.conn-err{background:#f85149;box-shadow:0 0 6px #f85149}
.conn-wait{background:#ffd54f;box-shadow:0 0 6px #ffd54f}

.metric-card{background:#0d1117;border-radius:6px;padding:8px 12px}
.metric-label{color:#666;font-size:9px;text-transform:uppercase;letter-spacing:0.5px}
.metric-value{font-size:16px;font-weight:bold;margin-top:2px}

.group-tab{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;font-weight:bold;border-radius:8px 8px 0 0}
.group-container{border-radius:0 0 8px 8px;overflow:hidden}
.pair-col{background:#0d1117;padding:14px}

.signal-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold;text-transform:uppercase}
.sig-long{background:#23863615;color:#4caf50;border:1px solid #238636}
.sig-short{background:#f8514912;color:#f85149;border:1px solid #f85149}
.sig-neutral{background:#30363d;color:#666;border:1px solid #484f58}

.trade-row{border-radius:4px;padding:6px 10px;margin-top:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.trade-win{background:#23863615;border-left:3px solid #238636}
.trade-loss{background:#f8514912;border-left:3px solid #f85149}
.trade-active{background:#64ffda0d;border-left:3px solid #64ffda;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

.login-box{max-width:320px;margin:80px auto;padding:24px;background:#161b22;border:1px solid #30363d;border-radius:8px;font-family:sans-serif}
.login-box h2{font-size:15px;margin-bottom:16px;color:#64ffda}
.login-box input{width:100%;padding:8px 10px;margin-bottom:10px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#e0e0e0;font-size:13px;font-family:inherit}
.login-box button{width:100%;padding:8px;background:#238636;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.login-box button:hover{background:#2ea043}
.login-box .err{color:#f85149;font-size:12px;margin-top:8px}

#log-viewer{background:#0d1117;border:1px solid #30363d;border-radius:6px;height:180px;overflow-y:auto;padding:10px 12px;font-size:11px;line-height:1.8}
#log-viewer div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log-viewer::-webkit-scrollbar{width:6px}
#log-viewer::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

.tg{color:#4caf50}.tr{color:#f85149}.tv{color:#ffd54f}.ta{color:#64ffda}
</style>
</head>
<body>

<div id="app">

<!-- NAV BAR -->
<div style="background:#010409;padding:6px 20px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #30363d;font-size:12px">
  <a href="/" class="nav-link">&#9664; FreqUI</a>
  <a href="/v48.html" class="nav-link">V48 Dashboard</a>
  <a href="/monitor.html" class="nav-link active">Z-Score Monitor</a>
  <span style="flex:1"></span>
  <span style="color:#484f58;font-size:11px">{{ lastUpdate }}</span>
  <span class="conn-dot" :class="connected ? 'conn-ok' : 'conn-err'"></span>
  <span style="color:#666;font-size:11px">{{ wsStatus }}</span>
</div>

<!-- LOGIN -->
<div v-if="!token" class="login-box">
  <h2>Connect to Bot</h2>
  <input v-model="username" placeholder="Username" @keyup.enter="login">
  <input v-model="password" type="password" placeholder="Password" @keyup.enter="login">
  <button @click="login">Connect</button>
  <div v-if="loginError" class="err">{{ loginError }}</div>
</div>

<template v-else>

<!-- TOP BAR -->
<div style="background:#161b22;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="color:#64ffda;font-weight:bold;font-size:18px">Z-Score Monitor</span>
    <span :style="{background: connected ? '#4caf50' : '#f85149', color:'#000', padding:'3px 10px', borderRadius:'12px', fontSize:'11px', fontWeight:'bold'}">
      {{ connected ? 'LIVE' : 'OFFLINE' }}
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:16px;font-size:14px">
    <div><span style="color:#888">BTC:</span> <span style="color:#64ffda;font-weight:bold;font-size:18px">${{ btcPrice }}</span></div>
    <div><span style="color:#888">Pair Z:</span> <span :style="{color: zColor(btcData.pair_zscore), fontWeight:'bold', fontSize:'16px'}">{{ btcData.pair_zscore }}</span></div>
    <div><span style="color:#888">Spread Z:</span> <span :style="{color: zColor(btcData.spread_zscore), fontWeight:'bold', fontSize:'16px'}">{{ btcData.spread_zscore }}</span></div>
  </div>
</div>

<!-- BTC SECTION -->
<div style="background:#1c2333;border-bottom:1px solid #30363d;padding:12px 20px">
  <div style="display:flex;gap:16px;align-items:stretch">
    <!-- BTC Z-Score Chart -->
    <div style="flex:1;background:#0d1117;border-radius:8px;padding:12px;min-height:180px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="color:#ff9800;font-weight:bold;font-size:14px">BTC/USDC Z-Score</span>
        <span style="font-size:11px;color:#666">last {{ zHistory.labels.length }} ticks</span>
      </div>
      <div style="height:150px;position:relative">
        <canvas id="zscore-chart"></canvas>
      </div>
    </div>
    <!-- BTC Metrics -->
    <div style="width:200px;display:flex;flex-direction:column;gap:6px">
      <div class="metric-card" :style="{borderLeft: '4px solid ' + (btcData.regime_ok ? '#4caf50' : '#f85149')}">
        <div class="metric-label">Regime</div>
        <span class="metric-value" :style="{color: btcData.regime_ok ? '#4caf50' : '#f85149'}">{{ btcData.regime_ok ? 'RANGING' : 'FAIL' }}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div class="metric-card">
          <div class="metric-label">Momentum</div>
          <span class="metric-value" :style="{color: Math.abs(btcData.btc_mom) > 1.5 ? '#f85149' : '#aaa', fontSize:'14px'}">{{ btcData.btc_mom }}%</span>
        </div>
        <div class="metric-card">
          <div class="metric-label">ATR Z</div>
          <span class="metric-value" :style="{color: btcData.btc_atr_z > 2 ? '#f85149' : '#aaa', fontSize:'14px'}">{{ btcData.btc_atr_z }}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div class="metric-card">
          <div class="metric-label">Vol Status</div>
          <span class="metric-value" :style="{color: btcData.btc_high_vol ? '#f85149' : '#4caf50', fontSize:'14px'}">{{ btcData.btc_high_vol ? 'HIGH' : 'OK' }}</span>
        </div>
        <div class="metric-card">
          <div class="metric-label">Signal</div>
          <span class="signal-badge" :class="'sig-'+btcData.signal" style="margin-top:4px">{{ btcData.signal }}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div class="metric-card" :style="{borderLeft: btcData.btc_pump ? '3px solid #ffd54f' : 'none'}">
          <div class="metric-label">Pump</div>
          <span class="metric-value" :style="{color: btcData.btc_pump ? '#ffd54f' : '#4caf50', fontSize:'14px'}">{{ btcData.btc_pump ? 'YES' : 'NO' }}</span>
        </div>
        <div class="metric-card" :style="{borderLeft: btcData.btc_dump ? '3px solid #f85149' : 'none'}">
          <div class="metric-label">Dump</div>
          <span class="metric-value" :style="{color: btcData.btc_dump ? '#f85149' : '#4caf50', fontSize:'14px'}">{{ btcData.btc_dump ? 'YES' : 'NO' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- GROUP FOLDERS -->
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 20px">
  <!-- GROUP A -->
  <div>
    <div class="group-tab" style="background:#0f2d1f;border:1px solid #238636;border-bottom:none">
      <span style="color:#4caf50;font-size:14px">Group A</span>
      <span style="color:#238636;font-size:11px">{{ groupAPairs }}</span>
      <span style="color:#666;font-size:10px;margin-left:auto">LONG only</span>
    </div>
    <div class="group-container" style="border:1px solid #238636;border-top:none;background:#0a1612">
      <template v-for="(d, pair) in pairData" :key="'a-'+pair">
        <div v-if="d.group === 'A'" class="pair-col" style="border-bottom:1px solid #23863633">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:bold;color:#4caf50">{{ pair.split('/')[0] }}</span>
            <span class="signal-badge" :class="'sig-'+d.signal">{{ d.signal }}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
            <div class="metric-card">
              <div class="metric-label">Price</div>
              <span class="metric-value" style="font-size:14px;color:#e0e0e0">{{ d.price }}</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Pair Z</div>
              <span class="metric-value" :style="{fontSize:'14px', color: zColor(d.pair_zscore)}">{{ d.pair_zscore }}</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Spread Z</div>
              <span class="metric-value" :style="{fontSize:'14px', color: zColor(d.spread_zscore)}">{{ d.spread_zscore }}</span>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px">
            <div class="metric-card">
              <div class="metric-label">Vol</div>
              <span class="metric-value" style="font-size:12px;color:#aaa">{{ d.vol_ratio }}x</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Corr</div>
              <span class="metric-value" style="font-size:12px;color:#aaa">{{ d.rolling_corr }}</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Regime</div>
              <span class="metric-value" :style="{fontSize:'12px', color: d.regime_ok ? '#4caf50' : '#f85149'}">{{ d.regime_ok ? 'OK' : 'FAIL' }}</span>
            </div>
          </div>
          <div v-if="d.has_trade" class="trade-row trade-active">
            <span>{{ d.trade_side.toUpperCase() }}</span>
            <span :style="{color: d.trade_profit_pct >= 0 ? '#4caf50' : '#f85149'}">{{ d.trade_profit_pct }}%</span>
          </div>
        </div>
      </template>
    </div>
  </div>
  <!-- GROUP B -->
  <div>
    <div class="group-tab" style="background:#1a1a2e;border:1px solid #7c4dff;border-bottom:none">
      <span style="color:#b388ff;font-size:14px">Group B</span>
      <span style="color:#7c4dff;font-size:11px">{{ groupBPairs }}</span>
      <span style="color:#666;font-size:10px;margin-left:auto">SHORT + LONG</span>
    </div>
    <div class="group-container" style="border:1px solid #7c4dff;border-top:none;background:#0d0d1a">
      <template v-for="(d, pair) in pairData" :key="'b-'+pair">
        <div v-if="d.group === 'B'" class="pair-col" style="border-bottom:1px solid #7c4dff33">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:bold;color:#b388ff">{{ pair.split('/')[0] }}</span>
            <span class="signal-badge" :class="'sig-'+d.signal">{{ d.signal }}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
            <div class="metric-card">
              <div class="metric-label">Price</div>
              <span class="metric-value" style="font-size:14px;color:#e0e0e0">{{ d.price }}</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Pair Z</div>
              <span class="metric-value" :style="{fontSize:'14px', color: zColor(d.pair_zscore)}">{{ d.pair_zscore }}</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Spread Z</div>
              <span class="metric-value" :style="{fontSize:'14px', color: zColor(d.spread_zscore)}">{{ d.spread_zscore }}</span>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px">
            <div class="metric-card">
              <div class="metric-label">Vol</div>
              <span class="metric-value" style="font-size:12px;color:#aaa">{{ d.vol_ratio }}x</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Corr</div>
              <span class="metric-value" style="font-size:12px;color:#aaa">{{ d.rolling_corr }}</span>
            </div>
            <div class="metric-card">
              <div class="metric-label">Regime</div>
              <span class="metric-value" :style="{fontSize:'12px', color: d.regime_ok ? '#4caf50' : '#f85149'}">{{ d.regime_ok ? 'OK' : 'FAIL' }}</span>
            </div>
          </div>
          <div v-if="d.has_trade" class="trade-row trade-active">
            <span>{{ d.trade_side.toUpperCase() }}</span>
            <span :style="{color: d.trade_profit_pct >= 0 ? '#4caf50' : '#f85149'}">{{ d.trade_profit_pct }}%</span>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- RAW LOG -->
<div style="padding:6px 20px 14px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="color:#aaa;font-size:12px;font-weight:bold">Raw WebSocket Log</span>
    <span style="color:#666;font-size:10px">{{ rawLog.length }} messages</span>
  </div>
  <div id="log-viewer" ref="logContainer">
    <div v-for="(entry, i) in rawLog" :key="i">
      <span style="color:#484f58">{{ entry.time }}</span>
      <span style="color:#666;margin:0 4px">|</span>
      <span style="color:#8b949e">{{ entry.raw }}</span>
    </div>
    <div v-if="rawLog.length === 0" style="color:#484f58">Waiting for messages...</div>
  </div>
</div>

</template>
</div>

<script>
const { createApp, ref, reactive, computed, nextTick } = Vue;

createApp({
  setup() {
    const username = ref('freqtrader');
    const password = ref('freqtrader');
    const token = ref('');
    const loginError = ref('');
    const connected = ref(false);
    const wsStatus = ref('Disconnected');
    const lastUpdate = ref('');

    const pairData = reactive({});
    const rawLog = reactive([]);
    const logContainer = ref(null);
    const MAX_LOG = 200;

    const zHistory = reactive({ labels: [], pairZ: [], spreadZ: [] });
    const MAX_HISTORY = 100;
    let chart = null;

    const baseUrl = window.location.origin;

    // Computed
    const btcData = computed(() => {
      for (const [pair, d] of Object.entries(pairData)) {
        if (pair.startsWith('BTC/')) return d;
      }
      return {
        pair_zscore: 0, spread_zscore: 0, signal: 'neutral',
        btc_mom: 0, btc_atr_z: 0, btc_pump: false, btc_dump: false,
        btc_high_vol: false, regime_ok: 1, has_trade: false,
        trade_side: '', trade_profit_pct: 0, vol_ratio: 1, rolling_corr: 0,
      };
    });

    const btcPrice = computed(() => {
      for (const [pair, d] of Object.entries(pairData)) {
        if (pair.startsWith('BTC/')) return d.price?.toLocaleString() || '--';
      }
      return '--';
    });

    const groupAPairs = computed(() => {
      return Object.entries(pairData)
        .filter(([,d]) => d.group === 'A')
        .map(([p]) => p.split('/')[0])
        .join(' + ') || '...';
    });

    const groupBPairs = computed(() => {
      return Object.entries(pairData)
        .filter(([,d]) => d.group === 'B')
        .map(([p]) => p.split('/')[0])
        .join(' + ') || '...';
    });

    function zColor(z) {
      if (z > 2) return '#f85149';
      if (z > 1) return '#ff9800';
      if (z < -2) return '#4caf50';
      if (z < -1) return '#64ffda';
      return '#aaa';
    }

    // Login
    async function login() {
      loginError.value = '';
      try {
        const resp = await fetch(`${baseUrl}/api/v1/token/login`, {
          method: 'POST',
          headers: { 'Authorization': 'Basic ' + btoa(username.value + ':' + password.value) },
        });
        if (!resp.ok) { loginError.value = 'Login failed'; return; }
        const data = await resp.json();
        token.value = data.access_token;
        await nextTick();
        connectWS();
        initChart();
      } catch (e) {
        loginError.value = `Error: ${e.message}`;
      }
    }

    // WebSocket
    let ws = null;

    function connectWS() {
      if (ws) { ws.close(); ws = null; }
      const wsUrl = `${baseUrl.replace('http', 'ws')}/api/v1/message/ws?token=${token.value}`;
      wsStatus.value = 'Connecting...';
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        connected.value = true;
        wsStatus.value = 'Connected';
        ws.send(JSON.stringify({ type: 'subscribe', data: ['strategy_msg'] }));
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          const now = new Date().toLocaleTimeString();

          rawLog.push({ time: now, raw: evt.data.substring(0, 400) });
          if (rawLog.length > MAX_LOG) rawLog.shift();
          nextTick(() => {
            if (logContainer.value) logContainer.value.scrollTop = logContainer.value.scrollHeight;
          });

          if (msg.type === 'strategy_msg' && msg.msg) {
            let payload;
            if (typeof msg.msg === 'string') {
              try { payload = JSON.parse(msg.msg); } catch { return; }
            } else {
              payload = msg.msg;
            }
            if (!payload.monitor) return;
            handleMonitorMsg(payload);
          }
        } catch {}
      };

      ws.onclose = () => {
        connected.value = false;
        wsStatus.value = 'Disconnected';
        setTimeout(connectWS, 5000);
      };

      ws.onerror = () => {
        connected.value = false;
        wsStatus.value = 'Error';
      };
    }

    function handleMonitorMsg(d) {
      lastUpdate.value = new Date().toLocaleTimeString();
      pairData[d.pair] = d;

      if (d.pair.startsWith('BTC/')) {
        const t = d.timestamp || '';
        const label = t.includes(' ') ? t.split(' ').pop().substring(0,5) : new Date().toLocaleTimeString().substring(0,5);
        zHistory.labels.push(label);
        zHistory.pairZ.push(d.pair_zscore);
        zHistory.spreadZ.push(d.spread_zscore);
        if (zHistory.labels.length > MAX_HISTORY) {
          zHistory.labels.shift(); zHistory.pairZ.shift(); zHistory.spreadZ.shift();
        }
        updateChart();
      }
    }

    // Chart
    function initChart() {
      const ctx = document.getElementById('zscore-chart');
      if (!ctx) return;
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: zHistory.labels,
          datasets: [
            { label: 'Pair Z', data: zHistory.pairZ, borderColor: '#64ffda', backgroundColor: 'rgba(100,255,218,0.08)', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true },
            { label: 'Spread Z', data: zHistory.spreadZ, borderColor: '#ffd54f', backgroundColor: 'rgba(255,213,79,0.08)', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: 200 },
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: { ticks: { color: '#484f58', maxTicksLimit: 8, font: { size: 9, family: 'monospace' } }, grid: { color: '#21262d' } },
            y: { ticks: { color: '#484f58', font: { size: 9, family: 'monospace' } }, grid: { color: '#21262d' } },
          },
          plugins: { legend: { labels: { color: '#666', font: { size: 10, family: 'monospace' } } } },
        },
        plugins: [{
          id: 'thresholds',
          afterDraw(ch) {
            const { ctx, chartArea, scales } = ch;
            if (!chartArea) return;
            const yS = scales.y;
            [
              { v:2, c:'#f85149', d:[4,4] }, { v:1, c:'#ff9800', d:[4,4] },
              { v:0, c:'#30363d', d:[] },
              { v:-1, c:'#64ffda', d:[4,4] }, { v:-2, c:'#4caf50', d:[4,4] },
            ].forEach(l => {
              const y = yS.getPixelForValue(l.v);
              if (y < chartArea.top || y > chartArea.bottom) return;
              ctx.save(); ctx.strokeStyle = l.c; ctx.lineWidth = 1; ctx.setLineDash(l.d);
              ctx.beginPath(); ctx.moveTo(chartArea.left, y); ctx.lineTo(chartArea.right, y); ctx.stroke();
              ctx.fillStyle = l.c; ctx.font = '9px monospace';
              ctx.fillText(l.v.toString(), chartArea.right + 4, y + 3);
              ctx.restore();
            });
          },
        }],
      });
    }

    function updateChart() {
      if (!chart) return;
      chart.data.labels = [...zHistory.labels];
      chart.data.datasets[0].data = [...zHistory.pairZ];
      chart.data.datasets[1].data = [...zHistory.spreadZ];
      chart.update('none');
    }

    return {
      username, password, token, loginError,
      connected, wsStatus, lastUpdate,
      pairData, btcData, btcPrice,
      groupAPairs, groupBPairs,
      rawLog, logContainer,
      zColor, login,
    };
  },
}).mount('#app');
</script>
</body>
</html>
